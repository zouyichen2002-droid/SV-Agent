# 复制为 config.local.toml 后按机器改。config.local.* 已被 .gitignore 排除。
# 素材路径一律走配置，不进代码 —— 这样基准曲可替换、eval 能跑多首歌。

[paths]
models   = "E:/SynthV-models"          # 模型权重根目录，靠 scripts/fetch_models 重建
cache    = "E:/sv-bridge/.cache"        # 中间产物（f0 轨迹等），已被 gitignore
reports  = "E:/sv-bridge/eval/reports"  # eval 输出

[models]
zh_ctc = "zh-ctc"          # 相对 paths.models
rmvpe  = "rmvpe/rmvpe.pt"  # 相对 paths.models

# ---- 基准曲 / 回归用例。可以有多个 [[songs]] ----
[[songs]]
id       = "chaosheng"
title    = "潮声回响"
bpm      = 86.00
first_beat_s = 0.240
# 分离出的 stem
vocals   = "E:/潮声回响/人声分离/htdemucs/来自塞壬的歌谣，听『潮声回响』【洛天依海洋之心原创曲】/vocals.wav"
no_vocals= "E:/潮声回响/人声分离/htdemucs/来自塞壬的歌谣，听『潮声回响』【洛天依海洋之心原创曲】/no_vocals.wav"
lyrics   = "E:/潮声回响/翻唱重制/lyrics.lrc"
project  = "E:/潮声回响/翻唱重制/潮声回响-86BPM.svp"
# LRC 前 10 行（2.45–13.11s）在本份 render 里无人声，见 specs/benchmark-facts-chaosheng.md §2
lyrics_skip_before_s = 20.0
# 和声（括号）行集中区间，见同文件 §3
harmony_window_s = [92.85, 151.88]

[pitch]
sr        = 16000     # 三个估计器的共同采样率
hop_s     = 0.010     # 共同帧栅格 10ms（三者原生都是 10ms，无需重采样）
fmin_hz   = 70.0
fmax_hz   = 900.0
agree_cents = 50.0    # 「一致」判据：0.5 半音

# ---- 证据规则（ADR-0004，用户拍板）----
conf_gate = 0.2       # 各估计器的置信门限
min_agree = 2         # 共识簇里至少几个估计器
required  = ["rmvpe"] # 必须参与确认的估计器。理由见 ADR-0004：
                      # 风险精确集中在「只有 crepe+praat 联署」那 4.8% 的帧

# ---- 阶段 2 逐行对齐 ----
[align]
# 人声活动检测（阈值由带标签锚点扫出，见 align/activity.py）
act_rms_db_min   = -23.0
act_ratio_db_min = 2.0
act_close_s      = 0.25
act_open_s       = 0.08
# 逐行偏移的搜索半径。**刻意收窄**：行距 ~2.5s、盒长 ~2.8s 时，
# 整块滑一行照样处处贴合（槽位歧义），单调 DP 拦不住。交接文件 §4.1
# 实测逐行残差量级是 ±0.41s，所以 0.6s 已覆盖真实偏移；更大的表观偏移
# 是槽位歧义而非真偏移，本层解不了，留给阶段 3 的 CTC。
max_shift_s        = 0.60
# 向全局偏移拉回的先验权重（得分量纲 0..1，0.10 意味着 0.6s 偏移扣 0.06 分）
prior_w            = 0.10
margin_s           = 0.40   # 匹配滤波的边缘宽度
decisive_plateau_s = 0.30   # 不确定度超过此值即判为"定不住"，退回全局偏移

# ---- 阶段门槛（ADR-0004，用户拍板：一致率 + 覆盖率双门槛）----
[gates.stage1]
pair_agree_min      = 0.85   # 任意两个独立估计器在共同有声帧上的一致率
line_coverage_median_min = 0.65  # 演唱行的音高证据覆盖中位

[gates.stage2]
line_residual_max_s = 0.150  # 逐行 LRC 偏移的残差上限

[gates.stage3]
direct_align_min = 0.98      # 字级直接对齐率（不含插值）

[gates.stage4]
min_note_ms   = 85           # 最短音符时长
max_note_s    = 1.70         # 最长音符时长
max_overlaps  = 0            # 允许的重叠对数
fabricated_notes_max = 0     # 无声学证据的音符数上限
